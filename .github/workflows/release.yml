name: Release

# A tag such as v0.1.1 builds the AppImage from that commit and publishes it as a release.
# Running the workflow by hand only builds and uploads the file as a workflow artifact.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions: {}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install what the unit tests need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libavcodec-dev libavutil-dev

      - name: Unit tests
        run: make test

      - name: Work out the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
              echo "value=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
              echo "value=dev-${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the AppImage
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: packaging/appimage/build-appimage.sh "$VERSION" dist

      - name: Check the result
        working-directory: dist
        run: |
          sha256sum -c ./*.AppImage.sha256
          images=(./*.AppImage)
          test "${#images[@]}" = 1
          "${images[0]}" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/tvt-dvr-client
          missing=$(env -i ldd squashfs-root/usr/bin/tvt-dvr-client | grep -c 'not found' || true)
          echo "libraries not found: $missing"
          test "$missing" = 0
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: appimage
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: appimage
          path: dist

      # The bundled FFmpeg libraries are LGPL, so the source they were built from goes with them.
      - name: Fetch and verify the FFmpeg source
        run: |
          version=$(sed -n 's/^ARG FFMPEG_VERSION=//p' packaging/appimage/Dockerfile)
          sha256=$(sed -n 's/^ARG FFMPEG_SHA256=//p' packaging/appimage/Dockerfile)
          curl -fsSL -o "dist/ffmpeg-$version.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          curl -fsSL -o "dist/ffmpeg-$version.tar.xz.asc" "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz.asc"
          echo "$sha256  dist/ffmpeg-$version.tar.xz" | sha256sum -c -

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sum=$(cut -d' ' -f1 dist/tvt-dvr-client-"$version"-x86_64.AppImage.sha256)
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA256@/$sum/g" packaging/appimage/release-notes.md > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
              dist/tvt-dvr-client-"$version"-x86_64.AppImage dist/tvt-dvr-client-"$version"-x86_64.AppImage.sha256 \
              dist/ffmpeg-*.tar.xz dist/ffmpeg-*.tar.xz.asc
